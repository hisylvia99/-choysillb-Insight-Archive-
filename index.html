<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

</head>

  <!-- 휴지통 모달 팝업 -->
  <div id="trashModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">

      <div class="flex justify-between items-center border-b dark:border-slate-700 pb-3">

  <script>
    // ⚠️ Supabase 설정 (본인의 URL과 Key 넣기)
    const SUPABASE_URL = 'uqfikmmligdfgmsoakgs'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_PkvyJel6X8aFZZKvmixOug_jdrrqgrW'; 
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let newsList = [];
    let trashList = [];
    let selectedCategory = 'ALL';
    let readFilterType = 'all';
    let currentImageData = '';
    let currentPage = 1;
    const itemsPerPage = 10;

    function getTodayDateString() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    // Supabase에서 데이터 불러오기
    async function loadInitialData() {
      try {
        const { data, error } = await supabaseClient
          .from('news_scraps')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        newsList = (data || []).map(item => ({
          id: item.id,
          category: item.category,
          date: item.date,
          title: item.title,
          url: item.url,
          image: item.image,
          countriesCompanies: item.countries_companies,
          keywords: item.keywords,
          summary: item.summary,
          stakeholders: item.stakeholders,
          hiddenContext: item.hidden_context,
          memo: item.memo,
          readStatus: item.read_status,
          bookmarked: item.bookmarked,
          deletedAt: item.deleted_at ? new Date(item.deleted_at).getTime() : null
        }));

        trashList = newsList.filter(item => item.deletedAt);
        newsList = newsList.filter(item => !item.deletedAt);

        renderApp();
      } catch (err) {
        console.error('데이터 로드 실패:', err);
      }

      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('darkModeBtn').innerHTML = `<i class="fa-solid fa-sun"></i> 라이트모드`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('formDate').value = getTodayDateString();
      loadInitialData();
    });

    function toggleDarkMode() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('darkMode', isDark);
      document.getElementById('darkModeBtn').innerHTML = isDark ? `<i class="fa-solid fa-sun"></i> 라이트모드` : `<i class="fa-solid fa-moon"></i> 다크모드`;
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImageData = e.target.result;
          document.getElementById('imagePreview').src = currentImageData;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // Supabase에 데이터 저장/수정
    async function saveToSupabase(itemData) {
      const dbData = {
        id: itemData.id,
        category: itemData.category,
        date: itemData.date,
        title: itemData.title,
        url: itemData.url,
        image: itemData.image,
        countries_companies: itemData.countriesCompanies,
        keywords: itemData.keywords,
        summary: itemData.summary,
        stakeholders: itemData.stakeholders,
        hidden_context: itemData.hiddenContext,
        memo: itemData.memo,
        read_status: itemData.readStatus,
        bookmarked: itemData.bookmarked,
        deleted_at: itemData.deletedAt ? new Date(itemData.deletedAt).toISOString() : null
      };

      const { error } = await supabaseClient.from('news_scraps').upsert(dbData);
      if (error) console.error('Supabase 저장 오류:', error);
    }

    async function toggleBookmark(id) {
      const item = newsList.find(n => n.id === id);
      if(item) { 
        item.bookmarked = !item.bookmarked; 
        await saveToSupabase(item);
        renderApp(); 
      }
    }

    async function toggleReadStatus(id) {
      const item = newsList.find(n => n.id === id);
      if(item) { 
        item.readStatus = !item.readStatus; 
        await saveToSupabase(item);
        renderApp(); 
      }
    }

    async function moveToTrash(id) {
      const itemIndex = newsList.findIndex(n => n.id === id);
      if (itemIndex !== -1) {
        const [removedItem] = newsList.splice(itemIndex, 1);
        removedItem.deletedAt = new Date().getTime();
        trashList.unshift(removedItem);
        await saveToSupabase(removedItem);
        renderApp();
        alert("스크랩이 휴지통으로 이동되었습니다.");
      }
    }

    async function restoreScrap(id) {
      const index = trashList.findIndex(n => n.id === id);
      if (index !== -1) {
        const [restoredItem] = trashList.splice(index, 1);
        restoredItem.deletedAt = null;
        newsList.unshift(restoredItem);
        await saveToSupabase(restoredItem);
        renderApp();
        renderTrashList();
        alert("성공적으로 복원되었습니다!");
      }
    }

    async function permanentDelete(id) {
      if (confirm('정말로 영구 삭제하시겠습니까?')) {
        trashList = trashList.filter(n => n.id !== id);
        const { error } = await supabaseClient.from('news_scraps').delete().eq('id', id);
        if(!error) {
          renderTrashList();
          alert('영구 삭제되었습니다.');
        }
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const editId = document.getElementById('editId').value;
      const urlImgInput = document.getElementById('formImage').value;
      if(urlImgInput && !urlImgInput.startsWith('[')) {
        currentImageData = urlImgInput;
      }

      const formData = {
        category: document.getElementById('formCategory').value,
        date: document.getElementById('formDate').value,
        title: document.getElementById('formTitle').value,
        url: document.getElementById('formUrl').value,
        image: currentImageData,
        countriesCompanies: document.getElementById('formCountriesCompanies').value,
        keywords: document.getElementById('formKeywords').value,
        summary: document.getElementById('formSummary').value,
        stakeholders: document.getElementById('formStakeholders').value,
        hiddenContext: document.getElementById('formHiddenContext').value,
        memo: document.getElementById('formMemo').value
      };

      let targetItem;
      if (editId) {
        targetItem = newsList.find(item => item.id === editId);
        Object.assign(targetItem, formData);
      } else {
        targetItem = {
          id: Date.now().toString(),
          ...formData,
          readStatus: false,
          bookmarked: false,
          deletedAt: null
        };
        newsList.unshift(targetItem);
      }

      await saveToSupabase(targetItem);
      renderApp();
      closeModal();
    }

    // 파일 불러오기 시 Supabase에 자동 저장 기능[cite: 8, 9]
    async function importData(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          let itemsToImport = [];
          if(Array.isArray(imported)) {
            itemsToImport = imported;
          } else if(imported.newsList) {
            itemsToImport = imported.newsList;
          }

          for(let item of itemsToImport) {
            if(!item.id) item.id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
            await saveToSupabase(item);
          }
          await loadInitialData();
          alert('백업 데이터를 불러와 Supabase에 동기화했습니다!');
        } catch(err) {
          alert('올바른 JSON 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    function exportData() {
      const backupData = { newsList, trashList };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `news_scrap_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function exportCSV() {
      let csv = '\uFEFF카테고리,날짜,제목,URL,요약,메모\n';
      newsList.forEach(item => {
        csv += `"${item.category}","${item.date}","${item.title.replace(/"/g, '""')}","${item.url}","${(item.summary || '').replace(/"/g, '""')}","${(item.memo || '').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `news_scraps_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function renderApp() {
      const newsContainer = document.getElementById('newsList');
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const dateFilter = document.getElementById('dateFilter').value;
      const sortBy = document.getElementById('sortBy').value;

      document.getElementById('trashCountBadge').innerText = trashList.length;

      let filtered = newsList.filter(item => {
        const matchesCategory = selectedCategory === 'ALL' || item.category === selectedCategory;
        const matchesDate = !dateFilter || item.date === dateFilter;

        let matchesReadFilter = true;
        if (readFilterType === 'bookmark') matchesReadFilter = item.bookmarked;
        else if (readFilterType === 'unread') matchesReadFilter = !item.readStatus;
        else if (readFilterType === 'read') matchesReadFilter = item.readStatus;
        
        const contentSearch = [
          item.title, item.countriesCompanies, item.keywords,
          item.summary, item.stakeholders, item.hiddenContext, item.memo
        ].join(' ').toLowerCase();

        return matchesCategory && matchesReadFilter && matchesDate && contentSearch.includes(searchKeyword);
      });

      filtered.sort((a, b) => sortBy === 'newest' ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
      document.getElementById('totalCount').innerText = `총 ${filtered.length}개의 스크랩`;

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const paginatedItems = filtered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

      if (filtered.length === 0) {
        newsContainer.innerHTML = `<div class="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300"><p class="text-slate-500 font-medium">저장된 뉴스 스크랩이 없습니다.</p></div>`;
        document.getElementById('paginationContainer').innerHTML = '';
      } else {
        newsContainer.innerHTML = paginatedItems.map(item => `
          <article class="glass-card rounded-2xl p-6 shadow-sm hover:shadow-md transition-all space-y-4">
            <div class="flex items-start justify-between gap-4 border-b pb-3">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <label class="flex items-center gap-1.5 text-xs cursor-pointer font-medium bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-lg text-slate-700 dark:text-slate-300">
                    <input type="checkbox" ${item.readStatus ? 'checked' : ''} onchange="toggleReadStatus('${item.id}')" class="rounded text-blue-600">
                    <span>${item.readStatus ? '✅ 읽음' : '⏳ 나중에 읽기'}</span>
                  </label>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700">${item.category}</span>
                  <span class="text-xs text-slate-400">${item.date}</span>
                </div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 hover:text-blue-600 transition-colors">
                  ${item.url ? `<a href="${item.url}" target="_blank" class="flex items-center gap-1.5">${item.title} <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i></a>` : item.title}
                </h2>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="editScrap('${item.id}')" class="text-slate-400 hover:text-blue-500"><i class="fa-regular fa-pen-to-square text-lg"></i></button>
                <button onclick="toggleBookmark('${item.id}')" class="text-slate-400 hover:text-amber-500"><i class="fa-${item.bookmarked ? 'solid text-amber-500' : 'regular'} fa-bookmark text-lg"></i></button>
                <button onclick="moveToTrash('${item.id}')" class="text-slate-400 hover:text-red-500"><i class="fa-regular fa-trash-can text-lg"></i></button>
              </div>
            </div>
            ${item.image ? `<div class="overflow-hidden rounded-xl border max-h-64 flex justify-center"><img src="${item.image}" alt="이미지" class="object-cover w-full"></div>` : ''}
            <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4 space-y-2 text-xs">
              <h3 class="font-bold text-blue-600">[핵심 요약]</h3>
              ${item.summary ? `<p class="text-slate-700 dark:text-slate-200 font-medium pre-wrap">${item.summary}</p>` : ''}
            </div>
            ${item.memo ? `<div class="bg-amber-50 dark:bg-amber-950/35 border p-3 rounded-xl text-xs"><strong>💡 내 관점:</strong> <span class="pre-wrap">${item.memo}</span></div>` : ''}
          </article>
        `).join('');
        renderPagination(totalPages);
      }
      renderSidebar();
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('paginationContainer');
      if (totalPages <= 1) { container.innerHTML = ''; return; }
      let html = `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 px-3 py-1.5 bg-slate-200 rounded-lg text-xs"' : 'class="px-3 py-1.5 bg-white border rounded-lg text-xs"'}>이전</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button onclick="changePage(${i})" class="px-3.5 py-1.5 ${i === currentPage ? 'bg-blue-600 text-white font-bold' : 'bg-white border'} rounded-lg text-xs">${i}</button>`;
      }
      html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 px-3 py-1.5 bg-slate-200 rounded-lg text-xs"' : 'class="px-3 py-1.5 bg-white border rounded-lg text-xs"'}>다음</button>`;
      container.innerHTML = html;
    }

    function changePage(page) { currentPage = page; renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function renderSidebar() {
      const categories = ['ALL', '🏛️ 정치/정책', '💻 IT/Tech', '💵 경제/금융', '💡 사회/이슈', '🗺️ 국제/안보', '🏢 기업/산업', '🎸 기타'];
      document.getElementById('categoryFilter').innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="w-full text-left px-3 py-1.5 rounded-lg flex items-center justify-between ${selectedCategory === cat ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600'}">
          <span>${cat === 'ALL' ? '전체 보기' : cat}</span>
          <span class="text-xs text-slate-400">${cat === 'ALL' ? newsList.length : newsList.filter(n => n.category === cat).length}</span>
        </button>
      `).join('');

      const tagMap = {};
      newsList.forEach(n => {
        if(n.keywords) {
          n.keywords.split(',').forEach(k => {
            const tag = k.trim();
            if(tag) tagMap[tag] = (tagMap[tag] || 0) + 1;
          });
        }
      });

      const sortedTags = Object.entries(tagMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
      document.getElementById('tagCloud').innerHTML = sortedTags.map(([tag, count]) => `
        <button onclick="filterByTag('${tag}')" class="text-xs bg-slate-100 dark:bg-slate-800 hover:bg-blue-100 hover:text-blue-600 px-2.5 py-1 rounded-full text-slate-600 dark:text-slate-300">
          #${tag} (${count})
        </button>
      `).join('') || '<span class="text-xs text-slate-400">등록된 키워드가 없습니다.</span>';
    }

    function setCategory(cat) { selectedCategory = cat; currentPage = 1; renderApp(); }
    function setReadFilter(type) { readFilterType = type; currentPage = 1; renderApp(); }
    function filterByTag(tag) { document.getElementById('searchInput').value = tag; currentPage = 1; renderApp(); }
    function onSearchInput() { currentPage = 1; renderApp(); }
    function onDateChange() { currentPage = 1; renderApp(); }
    function resetToMain() { selectedCategory = 'ALL'; setReadFilter('all'); currentPage = 1; renderApp(); }

    function openModal() {
      document.getElementById('editId').value = '';
      document.getElementById('scrapForm').reset();
      currentImageData = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('modalTitle').innerText = '새 뉴스 스크랩 등록';
      document.getElementById('submitBtnText').innerText = '저장하기';
      document.getElementById('formDate').value = getTodayDateString();
      document.getElementById('scrapModal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('scrapModal').classList.add('hidden'); }
    function openTrashModal() { renderTrashList(); document.getElementById('trashModal').classList.remove('hidden'); }
    function closeTrashModal() { document.getElementById('trashModal').classList.add('hidden'); }

    function renderTrashList() {
      const container = document.getElementById('trashList');
      if (trashList.length === 0) { container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">휴지통이 비어 있습니다.</p>`; return; }
      container.innerHTML = trashList.map(item => `
        <div class="bg-slate-50 dark:bg-slate-900 p-3 rounded-xl border flex items-center justify-between gap-3 text-xs">
          <p class="font-bold truncate">${item.title}</p>
          <div class="flex gap-1">
            <button onclick="restoreScrap('${item.id}')" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg">복원</button>
            <button onclick="permanentDelete('${item.id}')" class="px-2.5 py-1 bg-red-600 text-white rounded-lg">삭제</button>
          </div>
        </div>
      `).join('');
    }

    function editScrap(id) {
      const item = newsList.find(n => n.id === id);
      if(!item) return;
      document.getElementById('editId').value = item.id;
      document.getElementById('formCategory').value = item.category;
      document.getElementById('formDate').value = item.date;
      document.getElementById('formTitle').value = item.title;
      document.getElementById('formUrl').value = item.url;
      document.getElementById('formCountriesCompanies').value = item.countriesCompanies || '';
      document.getElementById('formKeywords').value = item.keywords || '';
      document.getElementById('formSummary').value = item.summary || '';
      document.getElementById('formStakeholders').value = item.stakeholders || '';
      document.getElementById('formHiddenContext').value = item.hiddenContext || '';
      document.getElementById('formMemo').value = item.memo || '';
      currentImageData = item.image || '';
      if(currentImageData) {
        document.getElementById('imagePreview').src = currentImageData;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      }
      document.getElementById('modalTitle').innerText = '뉴스 스크랩 수정';
      document.getElementById('submitBtnText').innerText = '수정 완료';
      document.getElementById('scrapModal').classList.remove('hidden');
    }
  </script>
</body>
</html>
